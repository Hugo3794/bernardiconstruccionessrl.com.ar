<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bernardi Construcciones SRL</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slide {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .slide img {
      width: 100%;
      max-width: 1600px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <section class="slide"><img src="slide1.jpg" alt="Slide 1"></section>
  <section class="slide"><img src="slide2.jpg" alt="Slide 2"></section>
  <section class="slide"><img src="slide3.jpg" alt="Slide 3"></section>
  <section class="slide"><img src="slide4.jpg" alt="Slide 4"></section>
  <section class="slide"><img src="slide5.jpg" alt="Slide 5"></section>
  <section class="slide"><img src="slide6.jpg" alt="Slide 6"></section>
  <section class="slide"><img src="slide7.jpg" alt="Slide 7"></section>
  <section class="slide"><img src="slide8.jpg" alt="Slide 8"></section>
  <section class="slide"><img src="slide9.jpg" alt="Slide 9"></section>

</body>
</html>
